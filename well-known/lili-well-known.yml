source: live probes of /.well-known/ on every Lili host named in apis.yml and in the OpenAPI servers[]
summary: >-
  Exactly two real documents are served across the whole estate, both on the MCP host: RFC 8414
  OAuth authorization-server metadata and RFC 9728 OAuth protected-resource metadata. Nothing else
  exists anywhere — no security.txt on any host, no api-catalog, no ai-plugin.json, no OIDC
  discovery, and no A2A agent card.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the two 200s on mcp.lili.co. SecurityTxt pointer NOT
  emitted — RFC 9116 is unimplemented on every Lili host (lili.co returns a plain nginx 404 page,
  the others return their app shell or an S3 error).
false_positive_watch: >-
  lili.co, dev.lili.co and prod.lili.co all answer /.well-known/* with an HTML body; every one of
  them carries HTTP 404 in the status line, so none is a soft-200 shell, but any future round must
  read the status and not the fact that a body came back. mcp.lili.co returns HTTP 401 with an
  EMPTY body for every /.well-known/ path except the two OAuth documents — that is an auth gate,
  not a document.
