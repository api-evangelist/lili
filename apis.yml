apis:
- name: Lili Application API
  description: >-
    The Lili Connect Application API creates a new business bank account application (lead) in the Lili platform from
    partner-supplied applicant data, returning a customer UUID and a hosted onboarding URL that can be redirected to or
    embedded. Also supports updating an existing lead and uploading additional compliance documents.
  humanURL: https://dev.lili.co/apis/application
  baseURL: https://prod.lili.co
  tags:
  - Banking
  - Onboarding
  - KYC
  - Embedded Finance
