- name: Lili Customer Management API
  description: >-
    Endpoints for managing an onboarded Lili customer from a partner platform: download a signed bank account
    verification letter, register an incoming payment notification against a customer, and list the payments
    registered for the partner.
  humanURL: https://dev.lili.co/apis/customermanagement
  baseURL: https://prod.lili.co
  tags:
  - Banking
  - Payments
  - Business Banking
  properties:
  - type: OpenAPI
    url: openapi/lili-customer-management-api-openapi.yml
  - type: Documentation
    url: https://dev.lili.co/apis/customermanagement
  - type: APIReference
    url: https://dev.lili.co/apis/customermanagement
  - type: Overlay
    url: overlays/lili-customer-management-api-overlay.yaml
  - type: DeclineCodes
    url: errors/lili-decline-codes.yml
  - type: Authentication
    url: authentication/lili-authentication.yml
  - type: ErrorCatalog
    url: errors/lili-problem-types.yml
- name: Lili Webhooks API
  description: >-
    Register, list, update and delete webhook listeners that receive Lili onboarding and account lifecycle events
    (submitApplication, idVerification, firstRequestedDocs, applicationRejected, onboardingComplete, firstMoneyInOf1,
    payment_reconciled). Deliveries are signed with a per-webhook token and retried up to four times.
  humanURL: https://dev.lili.co/apis/webhooks/webhooks
  baseURL: https://prod.lili.co
  tags:
  - Webhooks
  - Banking
  - Onboarding
  properties:
  - type: OpenAPI
    url: openapi/lili-webhooks-api-openapi.yml
  - type: Documentation
    url: https://dev.lili.co/apis/webhooks/webhooks
  - type: APIReference
    url: https://dev.lili.co/apis/webhooks/webhooks
  - type: GettingStarted
    url: https://dev.lili.co/guides/lili-webhooks
  - type: Webhooks
    url: asyncapi/lili-webhooks.yml
  - type: Overlay
    url: overlays/lili-webhooks-api-overlay.yaml
- name: Lili MCP Server
  description: >-
    Remote, OAuth 2.0 protected Model Context Protocol server (Streamable HTTP, MCP spec 2025-03-26) exposing 44 tools
    that let an AI assistant read a Lili business customer's account summary, transactions, financial summaries,
    invoices, bills, suppliers, cards, tax bucket, statements, documents and business profile. Accountants can
    enumerate and switch between connected client accounts.
  humanURL: https://dev.lili.co/mcp
  baseURL: https://mcp.lili.co/mcp
  tags:
  - MCP
  - agent-native
  - Banking
  - Accounting
