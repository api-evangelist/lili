aid: lili
name: Lili
description: >-
  Lili is a U.S. small-business banking and financial-management platform (banking services provided by Sunrise Banks,
  N.A., Member FDIC) that combines a business checking account, high-yield savings, a Visa debit card, invoicing, bill
  pay, expense categorization, tax buckets and business-credit products for LLCs, corporations, partnerships, sole
  proprietors and non-profits. For developers Lili publishes the Lili Connect platform at dev.lili.co: an Application
  API that creates a pre-filled business bank account application and returns a hosted or embeddable onboarding URL, a
  Customer Management API for payment notification and bank-letter retrieval, a Webhooks API for onboarding lifecycle
  events, and a remote, OAuth 2.0 protected MCP server at mcp.lili.co that exposes 44 read-oriented tools over
  balances, transactions, invoices, bills, suppliers, cards, tax estimates, statements and business profile for AI
  assistants and accountants.
