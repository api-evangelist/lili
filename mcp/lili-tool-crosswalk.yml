generated: '2026-08-25'
method: derived
source: Derived by aligning Lili's published MCP tool reference (https://dev.lili.co/mcp, transcribed into mcp/lili-mcp.yml)
  against the three public OpenAPI contracts under openapi/ (lili-application-api-openapi.yml, lili-customer-management-api-openapi.yml,
  lili-webhooks-api-openapi.yml).
purpose: Bind each MCP tool to the REST operationId(s) that back it, so an agent can see which Lili capabilities
  have a public contract and which exist only behind the MCP OAuth gate.
headline: 'Zero overlap. Lili ships two disjoint developer products under one brand: a PARTNER REST surface (11
  operations: create/update an account application, upload documents, register partner payments, manage webhooks)
  authenticated with a partner accessKey:secretKey pair, and an END-CUSTOMER MCP surface (44 read tools over the
  customer''s own banking data) authenticated with the customer''s OAuth login. Not one MCP tool has a public REST
  operation behind it, and not one REST operation is exposed as a tool. Every crosswalk row is therefore mcp_only
  or rest_only — an honest empty intersection, not a mapping we failed to find.'
surfaces:
  openapi:
  - openapi/lili-application-api-openapi.yml
  - openapi/lili-customer-management-api-openapi.yml
  - openapi/lili-webhooks-api-openapi.yml
  openapi_auth: 'apiKey header — Authorization: Lili accessKey:secretKey (partner credential, issued by dev-resources@lili.co)'
  graphql: null
  mcp: https://mcp.lili.co/mcp
  mcp_auth: OAuth 2.0 authorization_code + PKCE (end-customer credential)
  mcp_gated: true
  mcp_gated_note: tools/list returned HTTP 401 anonymously on 2026-08-25, so tool inputSchemas are transcribed from
    the provider docs rather than introspected.
