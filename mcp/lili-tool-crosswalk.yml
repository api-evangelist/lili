rest_only:
- operationId: registerAccount
  method: PUT
  path: /lili/api/v1/lead
  api: Application API
  reason: Partner-side account origination. Creating a bank account application is a write on behalf of a prospect,
    not a read of an authenticated customer, so it is deliberately absent from the read-only MCP tool set.
- operationId: updateLead
  method: POST
  path: /lili/api/v1/lead/{customerId}
  api: Application API
  reason: Partner-side write; no MCP equivalent.
- operationId: uploadAdditionalDoc
  method: PUT
  path: /lili/api/v1/lead/{customerId}/upload
  api: Application API
  reason: Partner-side compliance document upload; no MCP equivalent.
- operationId: createPaymentNotification
  method: GET
  path: /lili/api/v1/{customerId}/bankLetter
  api: Customer Management API
  reason: 'Partner-scoped bank letter download. The MCP has lili_download_bank_account_letter, but it is a DIFFERENT
    product: it is scoped to the authenticated customer''s own account and takes a variant (GENERAL/ACH/WIRE_DOMESTIC/WIRE_INTERNATIONAL)
    the REST operation does not accept, and it is reached with a customer OAuth token rather than a partner key.
    Recorded as rest_only rather than crosswalked, because binding them would assert an equivalence the contracts
    do not support.'
  nearest_tool: lili_download_bank_account_letter
  nearest_confidence: low
- operationId: createPaymentNotification
  method: PUT
  path: /lili/api/v1/payments
  api: Customer Management API
  reason: Partner registers an inbound ACH payment against a Lili customer; no MCP equivalent.
  spec_defect: This operation and GET /lili/api/v1/{customerId}/bankLetter share the operationId createPaymentNotification.
    operationId must be unique across the document; one of the two is mis-assigned and a generator will collide
    on it.
- operationId: paymentList
  method: GET
  path: /lili/api/v1/partner/payments
  api: Customer Management API
  reason: Partner-scoped payment list. lili_search_transactions is customer-scoped over a different data set; not
    the same operation.
- operationId: getAll
  method: GET
  path: /lili/api/v1/webhooks
  api: Webhooks API
  reason: Partner webhook administration; no MCP equivalent.
- operationId: addWebhook
  method: PUT
  path: /lili/api/v1/webhooks
  api: Webhooks API
  reason: Partner webhook administration; no MCP equivalent.
- operationId: getWebhook
  method: GET
  path: /lili/api/v1/webhooks/{webhookId}
  api: Webhooks API
  reason: Partner webhook administration; no MCP equivalent.
- operationId: updateWebhook
  method: POST
  path: /lili/api/v1/webhooks/{webhookId}
  api: Webhooks API
  reason: Partner webhook administration; no MCP equivalent.
- operationId: deleteWebhook
  method: DELETE
  path: /lili/api/v1/webhooks/{webhookId}
  api: Webhooks API
  reason: Partner webhook administration; no MCP equivalent.
