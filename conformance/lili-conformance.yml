  - {name: BIPA / biometric data, detail: 'Dedicated biometric data written consent and a biometric data retention and privacy policy are published — the onboarding flow performs selfie-based document verification.', source: 'https://lili.co/legal-documents/lili-biometric-data-retention-and-privacy-policy'}
  - {name: Regulation GG (Unlawful Internet Gambling Enforcement Act), detail: 'Reg GG notice published.', source: 'https://lili.co/legal-documents/reg-gg-notice'}
  - {name: KYC / KYB / EDD, detail: 'The Application API models enhanced-due-diligence question/answer pairs (EDDQuestionData), UBO collection with ownership percentages, and a document set including IRS EIN letters and articles of incorporation.', source: 'openapi/lili-application-api-openapi.yml'}
  certifications_published: false
  certifications_note: >-
