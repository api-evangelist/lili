- {from: Account, to: Statement, type: has_many, via: statementId, surface: MCP}
- {from: Bill, to: Supplier, type: belongs_to, via: supplierExternalId, surface: MCP}
- {from: Transaction, to: TransactionCategory, type: belongs_to, via: categoryCode, surface: MCP}
- {from: BusinessProfile, to: UBO, type: has_many, via: lili_get_business_owners, surface: MCP}
